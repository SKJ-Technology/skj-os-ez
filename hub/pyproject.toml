[project]
name = "skj-hub"
version = "0.2.0"
description = "SKJ Hub: app store, updates and settings for SKJ OS EZ"
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
skj-hub = "skj_hub.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
